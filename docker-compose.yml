# ============================================================
# Minimall 单商户商城 —— Docker Compose 一键启动
#   mysql + redis + server + nginx(前端网关)
# 使用：
#   docker compose up -d --build
# 访问：
#   后端接口  http://localhost:8080/swagger-ui.html
#   H5 商城   http://localhost:8081   (nginx 分发，需先构建 uniapp H5)
#   后台      http://localhost:8081/admin-web/
# ============================================================

services:
  mysql:
    image: mysql:8.0
    container_name: minimall-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: minimall
      MYSQL_USER: minimall
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-minimall123}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    # 仅内网访问（避免与宿主机已有 3306 冲突）；如需宿主机直连可放开下面两行
    # ports:
    #   - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./server/src/main/resources/sql/minimall-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: minimall-redis
    restart: unless-stopped
    # ports:
    #   - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
    container_name: minimall-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: minimall
      MYSQL_USER: minimall
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-minimall123}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      TZ: Asia/Shanghai
    ports:
      - "${SERVER_BIND:-0.0.0.0}:${SERVER_PORT:-18082}:8080"
    volumes:
      - upload-data:/app/upload
      # 演示图片：随仓库提供，开箱即可看到完整商品图（只读，不影响用户上传）
      - ./deploy/demo-upload:/app/upload/demo:ro

  # nginx：前端网关（H5 / admin / 后端反代）——前端构建后启用
  # 前端产物目录约定：
  #   uniapp H5  -> deploy/www
  #   admin dist  -> deploy/www/admin
  nginx:
    image: nginx:1.27-alpine
    container_name: minimall-nginx
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-18080}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/www:/usr/share/nginx/html:ro
      - upload-data:/usr/share/nginx/upload
      # 演示图片（与 server 共享同一份只读挂载，保证 /file/demo/* 可访问）
      - ./deploy/demo-upload:/usr/share/nginx/upload/demo:ro

volumes:
  mysql-data:
  redis-data:
  upload-data:
