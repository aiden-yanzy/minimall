<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minimall 单商户商城</title>
  <style>
    body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: linear-gradient(135deg, #1e3c72, #2a5298); min-height: 100vh; color: #fff; display: flex; align-items: center; justify-content: center; }
    .box { text-align: center; }
    h1 { font-size: 44px; margin: 0 0 12px; letter-spacing: 2px; }
    p { opacity: .85; margin: 6px 0; }
    .links { margin-top: 36px; display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
    a { display: inline-block; padding: 12px 28px; border-radius: 24px; background: #fff; color: #1e3c72; text-decoration: none; font-weight: 600; }
    a.ghost { background: transparent; color: #fff; border: 2px solid rgba(255,255,255,.6); }
    .tip { margin-top: 32px; font-size: 13px; opacity: .6; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Minimall 商城</h1>
    <p>单商户自营商城 · Spring Boot 3 + Vue3</p>
    <div class="links">
      <a href="/admin-web/">管理后台</a>
      <a href="http://localhost:8080/swagger-ui.html" class="ghost">后端接口文档</a>
    </div>
    <div class="tip">
      H5 商城页面尚未构建：请用 HBuilderX 打开 uniapp/ 目录 → 运行到浏览器，将产物复制到 deploy/www/ 后即可在 8081 访问
    </div>
  </div>
</body>
</html>
