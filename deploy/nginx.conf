# Minimall nginx 网关配置
upstream minimall_server {
    server server:8080;
}

server {
    listen 80;
    server_name _;
    charset utf-8;

    # 上传文件
    location /file/ {
        alias /usr/share/nginx/upload/;
    }

    # 后端接口
    location /shop/ {
        proxy_pass http://minimall_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /admin/ {
        proxy_pass http://minimall_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /settings/ {
        proxy_pass http://minimall_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /file-api/ {
        proxy_pass http://minimall_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # H5 商城（uniapp 编译产物）
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 后台（admin dist 产物，独立 history 路由）
    location /admin-web/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin-web/index.html;
    }

    # PC 端商城（pc dist 产物）
    location /pc/ {
        alias /usr/share/nginx/html/pc/;
        try_files $uri $uri/ /pc/index.html;
    }
}
