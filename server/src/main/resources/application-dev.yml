spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:minimall}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:minimall}
    password: ${MYSQL_PASSWORD:minimall123}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      password: ${REDIS_PASSWORD:}

# Sa-Token 与 Redis 共用
sa-token:
  # 生产必须换成自己的随机串（>=32 位），否则 JWT 可被伪造
  jwt-secret-key: ${SA_JWT_SECRET:changeme-minimall-secret-for-p0}

# 文件上传本地目录
minimall:
  upload-dir: ./upload
  file-domain: ${FILE_DOMAIN:http://localhost:8080/file}
